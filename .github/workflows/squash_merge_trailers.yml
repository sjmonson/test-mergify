name: Custom Squash Merge with Trailers

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  api-squash-merge:
    if: github.event.label.name == 'merge-it'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures full git history is available to parse intermediate commits

      - name: Parse, Deduplicate, and Merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const baseBranch = context.payload.pull_request.base.ref;
            const headSha = context.payload.pull_request.head.sha;
            const execSync = require('child_process').execSync;

            // Step 1: Fetch the target base branch to isolate the PR's commits
            execSync(`git fetch origin ${baseBranch}`);
            
            // Step 2: Determine the common ancestor merge-base
            const mergeBase = execSync(`git merge-base origin/${baseBranch} ${headSha}`).toString().trim();
            
            // Step 3: Extract and isolate raw commit messages in the commit range
            const commitLog = execSync(`git log ${mergeBase}..${headSha} --format=%B`).toString();
            
            // Step 4: Run git interpret-trailers to parse all trailers out of the log
            // The --parse option isolates valid trailers while stripping surrounding commit bodies
            const parsedTrailers = execSync('git interpret-trailers --parse', { input: commitLog }).toString();
            
            // Step 5: Clean and deduplicate lines (essential for non-email trailers)
            const trailerLines = parsedTrailers.split('\n')
             .map(line => line.trim())
             .filter(line => line.length > 0);
              
            const uniqueTrailers =.join('\n');

            // Step 6: Construct the clean squash commit message payload
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '';
            const commitTitle = `${prTitle} (#${prNumber})`;
            
            // Format body: PR description, a double newline, and the structured trailer block
            let commitBody = prBody.replace(/\r\n/g, '\n').trim();
            if (uniqueTrailers) {
              commitBody = `${commitBody}\n\n${uniqueTrailers}`;
            }

            // Step 7: Push the payload to GitHub's REST API merge endpoint
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: commitTitle,
                commit_message: commitBody
              });
              console.log(`Successfully executed custom squash merge for PR #${prNumber}`);
            } catch (error) {
              core.setFailed(`API Squash Merge failed: ${error.message}`);
            }